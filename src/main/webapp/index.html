<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Murach Survey</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <main>
        <img class="logo" src="images/murach-logo.svg" alt="Murach logo">
        <h1>Survey</h1>
        <p>If you have a moment, we'd appreciate it if you would fill out this<br>survey.</p>

        <form action="emailList" method="post">
            <input type="hidden" name="action" value="add">
            <h2>Your information:</h2>

            <label for="firstName">First Name</label>
            <input id="firstName" name="firstName" type="text" required><br>

            <label for="lastName">Last Name</label>
            <input id="lastName" name="lastName" type="text" required><br>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required><br>

            <label for="dateOfBirth">Date of Birth</label>
            <input id="dateOfBirth" name="dateOfBirth" type="text"><br>

            <h2>How did you hear about us?</h2>
            <div class="radio-group">
                <input id="searchEngine" name="heardFrom" type="radio" value="Search engine" checked>
                <label for="searchEngine">Search engine</label>

                <input id="wordOfMouth" name="heardFrom" type="radio" value="Word of mouth">
                <label for="wordOfMouth">Word of mouth</label>

                <input id="socialMedia" name="heardFrom" type="radio" value="Social Media">
                <label for="socialMedia">Social Media</label>

                <input id="other" name="heardFrom" type="radio" value="Other">
                <label for="other">Other</label>
            </div>

            <h2>Would you like to receive announcements<br>about new CDs and special offers?</h2>
            <div class="check-group">
                <input id="wantsUpdates" name="wantsUpdates" type="checkbox" value="yes">
                <label for="wantsUpdates">YES, I'd like that.</label><br>

                <input id="emailOK" name="emailOK" type="checkbox" value="yes">
                <label for="emailOK">YES, please send me email announcements.</label>
            </div>

            <div class="contact-method">
                <label for="contactMethod">Please contact me by:</label>
                <select id="contactMethod" name="contactMethod">
                    <option>Email or postal mail</option>
                    <option>Email only</option>
                    <option>Postal mail only</option>
                </select>
            </div>

            <input type="submit" value="Submit" id="submit">
        </form>
    </main>
</body>
</html>
